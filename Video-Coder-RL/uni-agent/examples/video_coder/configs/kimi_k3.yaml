# Overlay: use Kimi K3 (Moonshot AI) as the teacher instead of gpt-6-astra.
#   export MOONSHOT_API_KEY=...          (see README, "用 Kimi K3 做 teacher")
#   --overlay configs/kimi_k3.yaml
# Chat Completions through litellm's `moonshot/` provider (https://api.moonshot.ai/v1; MOONSHOT_API_BASE overrides it,
# e.g. https://api.moonshot.cn/v1). The prompt is unchanged. Use a NEW output directory: the config hash differs.
# Kimi K3 always thinks. litellm sends the returned `reasoning_content` back on every assistant turn (Moonshot requires
# it), and the export keeps it as <think>...</think>. Temperature/top_p are fixed by Moonshot: do not set them here.
# If the API rejects images inside tool messages, add --overlay configs/kimi_k3_user_images.yaml after this one.
model:
  model_class: vcsft.models.VisualChatModel
  model_name: moonshot/kimi-k3
  cost_tracking: ignore_errors
  model_kwargs:
    drop_params: true
    parallel_tool_calls: false
    reasoning_effort: low                  # low | high | max. Moonshot's default is max: a single non-streaming request can
                                           # take many minutes while the API thinks, so max is not used here
    timeout: 1200                          # seconds per request (litellm's default is 6000)
