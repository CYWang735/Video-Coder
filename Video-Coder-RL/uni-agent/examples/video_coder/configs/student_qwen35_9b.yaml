# Overlay for baseline evaluation of Qwen3.5-9B served by vLLM (scripts/serve_vllm.sh).
# Use with: --config configs/teacher.yaml --overlay configs/student_qwen35_9b.yaml
# Only the model changes; prompts, tools, limits and acceptance stay identical to the teacher run.
model:
  model_class: litellm                     # Chat Completions + tool calls (vLLM qwen3_coder parser)
  model_name: hosted_vllm/Qwen3.5-9B
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: ${VLLM_API_BASE}             # e.g. http://localhost:8000/v1, expanded at load time
    drop_params: true
    parallel_tool_calls: false
    # Qwen3.5 model card: thinking mode, precise coding tasks
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    max_tokens: 16384
