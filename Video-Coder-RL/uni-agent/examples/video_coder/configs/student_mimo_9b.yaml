# Overlay for baseline evaluation of XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B served by vLLM:
#   MODEL=XiaomiMiMo/MiMo-V2.6-Distill-Qwen-9B bash scripts/serve_vllm.sh 1 8001
# Use with: --config configs/teacher.yaml --overlay configs/student_mimo_9b.yaml
# Same architecture as Qwen3.5-9B (Qwen3_5ForConditionalGeneration), MiMo v2.6 chat template with the same
# XML tool-call format (qwen3_coder parser) and <think>...</think> reasoning (qwen3 parser).
model:
  model_class: litellm
  model_name: hosted_vllm/MiMo-V2.6-Distill-Qwen-9B
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: ${VLLM_API_BASE}
    drop_params: true
    parallel_tool_calls: false
    # generation_config.json of the checkpoint
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    max_tokens: 16384
