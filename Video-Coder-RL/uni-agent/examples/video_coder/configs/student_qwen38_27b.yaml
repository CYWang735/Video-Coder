# Overlay for baseline evaluation of Qwen/Qwen3.8-27B served by vLLM (2x H100, tensor parallel):
#   MODEL=Qwen/Qwen3.8-27B TP=2 bash scripts/serve_vllm.sh 0,1 8000
# Use with: --config configs/teacher.yaml --overlay configs/student_qwen38_27b.yaml
# Same architecture family as Qwen3.5 (Qwen3_5ForConditionalGeneration), XML tool calls (qwen3_coder parser).
model:
  model_class: litellm
  model_name: hosted_vllm/Qwen3.8-27B
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: ${VLLM_API_BASE}
    drop_params: true
    parallel_tool_calls: false
    # model card: thinking mode
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    max_tokens: 32768
