# Claude Code training tasks on local Apptainer sandboxes (HPC nodes without Docker).
# Same tasks as task_config_claude_code.yaml, but each sandbox is a rootless
# `apptainer instance` on the host network, so Claude Code reaches the gateway
# directly. The host's Claude Code binary is bind-mounted into every sandbox.
#
# - sif_dir is pinned so pre-pull and training agree regardless of $TMPDIR; it is
#   node-local, so pre-pull the training images on the node that runs the rollouts
#   (examples/inference/prepull_apptainer_images.py) before starting training.
# - Replace the claude bind source with your own `readlink -f $(which claude)`.
# - CLAUDE_CODE_MAX_CONTEXT_TOKENS matches the rollout window of train_qwen3_moe.sh
#   (MAX_PROMPT_LENGTH 8k + MAX_RESPONSE_LENGTH 128k); adjust both together.
- name: swe_bench
  sandbox: &apptainer_sandbox
    provider: apptainer
    runtime_timeout: 7200
    sandbox_kwargs:
      sif_dir: /tmp/uni-agent-apptainer/sif
      pull_timeout: 1800
      binds:
        - /path/to/claude-code:/opt/claude-code/bin/claude:ro
      add_to_path:
        - /opt/claude-code/bin
  agent: &claude_code_agent
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    extra_env:
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: "64000"
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: "56000"
  prompt_template: &swe_claude_prompt
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory.

        Task description:
        {problem_statement}

        Inspect the relevant code, make the minimal correct changes, and verify the result with appropriate tests or checks. Do not modify tests or commit changes. When finished, briefly summarize what changed and how it was verified.

- name: swe_rebench
  sandbox: *apptainer_sandbox
  agent: *claude_code_agent
  prompt_template: *swe_claude_prompt

- name: swe_bench_multilingual
  sandbox: *apptainer_sandbox
  agent: *claude_code_agent
  prompt_template:
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory (primary language: {language}).

        Task description:
        {problem_statement}

        Inspect the relevant code, make the minimal correct changes, and verify the result with appropriate tests or checks. Do not modify tests or commit changes. When finished, briefly summarize what changed and how it was verified.
