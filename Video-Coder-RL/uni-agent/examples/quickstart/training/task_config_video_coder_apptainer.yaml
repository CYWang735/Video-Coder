# Video-Coder (Blender/bpy) task: vcsft harness in the bpy-agent.sif container.
# Harness: examples/video_coder (run_agent.py, vcsft/, bin/, configs/), bound read-only at /opt/video-coder;
# prompts are in examples/video_coder/configs/teacher.yaml (+ uni_container.yaml overlay).
# Prepare once: bash examples/video_coder/install_harness.sh  (adds imageio-ffmpeg to the tool dir).
- name: video_coder
  sandbox:
    provider: apptainer
    image: /home/hpc/v189bd/v189bd13/wangcy/images/bpy-agent.sif
    runtime_timeout: 5400
    sandbox_kwargs:
      # local .sif, no pull; the image is read-only, writes go to the per-instance overlay
      pull_policy: never
      binds:
        - /home/hpc/v189bd/v189bd13/wangcy/mini-swe-agent-tool-2.4.6:/opt/mini-swe-agent:ro
        - /home/hpc/v189bd/v189bd13/wangcy/uni-agent-v2/examples/video_coder:/opt/video-coder:ro
  agent:
    name: video_coder
    step_limit: 30
    run_timeout: 4800
    tool_python: /opt/mini-swe-agent/bin/python
