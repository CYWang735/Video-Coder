# video_coder + video reward: reward = 1.0 * accepted + 0.5 * video_reward (the video reward only for accepted
# rollouts). An accepted render goes to MiniMax-H3 Ref2VA as a reference video, and a VLM scores the result
# against the sample's GT video (metadata.gt_video; see uni_agent/tasks/video_coder/preprocess.py --gt-field).
# Both services are deployed separately; set their URLs below. ref2va.request must equal the recipe the GT
# videos were made with. shared_dir is read by the H3 server via file://, so it must exist on its host too.
# Video-Coder (Blender/bpy) task: Video-Coder harness in the bpy-agent.sif container.
# Harness: examples/video_coder (run_agent.py, video_coder_harness/, bin/, configs/), bound read-only at /opt/video-coder;
# prompts are in examples/video_coder/configs/teacher.yaml (+ uni_container_visual.yaml overlay).
# Visual feedback is on: run_blender returns preview frames as images in tool results, so the policy must be
# vision-capable and the gateway merges images mid-session (PR #214, qwen_vl_utils). For text-only feedback use
# the uni_container.yaml overlay instead.
# Prepare once: bash examples/video_coder/install_harness.sh  (adds imageio-ffmpeg to the tool dir).
- name: video_coder
  video_reward:
    gt_field: gt_video
    accept_weight: 1.0
    video_reward_weight: 0.5
    exe_anneal_steps: auto     # T: accept_weight * exp(-global_step / T); auto = total training steps, null = off
    on_error: raise            # raise: drop the rollout when H3/VLM fail; zero: count the video reward as 0
    keep_files: false
    ref2va:
      base_urls:                                 # MiniMax-H3 SGLang servers (Ref2VA), e.g. one per 4-GPU node
        - http://h3-node-1:30011
      shared_dir: /path/to/shared/video_coder_sim  # visible to the trainer and the H3 servers at the same path
      prompt_field: gen_prompt                   # metadata field with the GT's Ref2VA prompt (else task prompt)
      request:                                   # defaults = the GT recipe; per-sample overrides in metadata.gen_request
        model: MiniMaxAI/MiniMax-H3
        task: ref2va
        seconds: 6.0
        target: {short_edge: 480, aspect_ratio: auto, duration_seconds: 6.0}
        num_outputs_per_prompt: 1
        num_inference_steps: 50
        flow_shift: 12.0
        audio_flow_shift: 3.0
        seed: 42
      request_field: gen_request                 # preprocess --gt-request-sidecar fills it from <gt>.json
      poll_interval: 5
      timeout: 86400                             # submit to downloaded video, H3 queueing included: wait as long as it takes
    judge:
      base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1  # DashScope (Singapore)
      model: qwen3.8-omni-flash
      api_key_env: DASHSCOPE_API_KEY             # exported where Ray is started (never in this file)
      rubric: structured                         # 4 sub-scores (faithfulness/layout/motion/camera), weighted locally; overall: one score
      max_score: 1                               # the judge prompts score 0-1
      video_transport: data_url                  # file_url if the VLM server can read local files
      extra_body: {modalities: [text]}           # text-only replies from the Qwen Omni judge
      # proxy: http://proxy:port                 # if the trainer reaches DashScope through an HTTP proxy
      timeout: 600
  sandbox:
    provider: apptainer
    image: /path/to/bpy-agent.sif
    runtime_timeout: 5400
    sandbox_kwargs:
      # local .sif, no pull; the image is read-only, writes go to the per-instance overlay
      pull_policy: never
      binds:
        - /path/to/mini-swe-agent-tool:/opt/mini-swe-agent:ro
        - /path/to/Video-Coder-RL/uni-agent/examples/video_coder:/opt/video-coder:ro
  agent:
    name: video_coder
    step_limit: 100
    run_timeout: 4800
    tool_python: /opt/mini-swe-agent/bin/python
    overlays:
      - /opt/video-coder/configs/uni_container_visual.yaml   # visual feedback (preview frames as images)
