# Same as task_config_claude_code.yaml, but with local Apptainer sandboxes instead of
# Modal, for HPC nodes: sandboxes share the host network, so Claude Code reaches
# the gateway directly. Images are pulled once per node (set https_proxy if needed,
# and raise SANDBOX_STARTUP_TIMEOUT for cold pulls). Replace the bind source with
# your own `readlink -f $(which claude)`.
- name: swe_bench
  sandbox:
    provider: apptainer
    runtime_timeout: 7200
    sandbox_kwargs:
      pull_timeout: 1800
      binds:
        - /home/hpc/v189bd/v189bd13/.local/share/claude/versions/2.1.283:/opt/claude-code/bin/claude:ro
      add_to_path:
        - /opt/claude-code/bin
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    verbose: true
  prompt_template: &claude_code_prompt
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory.

        Task description:
        {problem_statement}

        Inspect the relevant code, make the minimal correct changes, and verify the result with appropriate tests or checks. Do not modify tests or commit changes. When finished, briefly summarize what changed and how it was verified.

- name: swe_bench_multilingual
  sandbox:
