      add_to_path:
        - /opt/claude-code/bin
  agent:
    name: claude_code
    max_turns: 200
    run_timeout: 4800
    verbose: true
  prompt_template:
    - role: user
      content: |-
        Read the following task description and resolve the issue in the current directory (primary language: {language}).

